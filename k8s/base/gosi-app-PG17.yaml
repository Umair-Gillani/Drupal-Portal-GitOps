kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app

spec:
  replicas: 1
  revisionHistoryLimit: 4

  selector:
    matchLabels:
      app: my-app

  template:
    metadata:
      labels:
        app: my-app

    spec:

      initContainers:
       - name: drush-cache-rebuild
         image: umairgl123/drupalportal:gosi_with_PG17
         imagePullPolicy: Always
      
         command:
           - /bin/bash
           - -c
           - |
             php /var/www/html/vendor/bin/drush.php cr
      
         env:
           - name: PGSQL_DATABASE
             value: "gosi_drupal"
      
           - name: PGSQL_HOST
             value: "gosi-postgresql"
      
           - name: PGSQL_USER
             value: "gosi_user"
      
           - name: PGSQL_PASSWORD
             value: "gosi_pass123"
      
           - name: PGSQL_PORT
             value: "5432"


      containers:
        - name: app
          image: umairgl123/drupalportal:gosi_with_PG17
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          env:
            - name: PGSQL_DATABASE
              value: "gosi_drupal"

            - name: PGSQL_HOST
              value: "gosi-postgresql"

            - name: PGSQL_USER
              value: "gosi_user"

            - name: PGSQL_PASSWORD
              value: "gosi_pass123"

            - name: PGSQL_PORT
              value: "5432"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "1Gi"
